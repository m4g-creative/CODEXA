<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Codexa | Web Compiler</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header class="header">

    <div class="logo">
        <span>Code</span>xa
    </div>

    <div class="actions">

        <button
            id="savedProjectsBtn"
            class="nav-btn"
            type="button"
        >
            Saved Projects
        </button>

        <button
            id="saveBtn"
            class="save-btn"
            type="button"
        >
            Save Project
        </button>

        <button
            id="downloadBtn"
            type="button"
        >
            Download ZIP
        </button>

        <button
            id="clearBtn"
            type="button"
        >
            Clear
        </button>

        <button
            id="runBtn"
            class="run-btn"
            type="button"
        >
            Run
        </button>

        <a
            id="githubBtn"
            class="github-btn"
            href="https://github.com/m4g-creative"
            target="_blank"
            rel="noopener noreferrer"
        >
            GitHub
        </a>

    </div>

</header>


<main class="container">


    <!-- =================================================
         COMPILER PAGE
         ================================================= -->

    <section
        id="compilerPage"
        class="compiler-page"
    >


        <!-- =================================================
             PROJECT NAME
             ================================================= -->

        <section class="project-name-card">

            <div class="project-name-info">

                <span class="project-name-label">
                    CURRENT PROJECT
                </span>

                <h2>
                    Project Name
                </h2>

                <p>
                    Give your project a name before saving or downloading.
                </p>

            </div>


            <div class="project-name-input-wrap">

                <input
                    id="projectNameInput"
                    type="text"
                    placeholder="Enter project name..."
                    autocomplete="off"
                    maxlength="80"
                >

            </div>

        </section>


        <!-- =================================================
             OPENED PROJECT BAR
             ================================================= -->

        <div
            id="openedProjectBar"
            class="opened-project-bar"
        >

            <button
                id="backToSavedProjectsFromCompiler"
                type="button"
            >
                ← Back to Saved Projects
            </button>

            <span id="openedProjectText">
                Saved project is currently open.
            </span>

        </div>


        <!-- =================================================
             PREVIEW
             ================================================= -->

        <section class="preview-card">

            <div class="preview-header">

                <span>
                    Live Preview
                </span>

                <button
                    id="fullscreenBtn"
                    type="button"
                >
                    Fullscreen
                </button>

            </div>

            <iframe
                id="preview"
                title="Codexa Live Preview"
            ></iframe>

        </section>


        <!-- =================================================
             EDITORS
             ================================================= -->

        <section class="editors">


            <!-- ==================== HTML ==================== -->

            <div class="editor html-editor">

                <div class="editor-header">

                    <span>
                        HTML
                    </span>

                    <button
                        type="button"
                        onclick="copyCode('htmlCode')"
                    >
                        Copy
                    </button>

                </div>

                <textarea
                    id="htmlCode"
                    spellcheck="false"
                ><h1>Hello Codexa!</h1>

<p>Start building your website.</p>

<button onclick="sayHello()">Click Me</button></textarea>

            </div>


            <!-- ==================== CSS ==================== -->

            <div class="editor css-editor">

                <div class="editor-header">

                    <span>
                        CSS
                    </span>

                    <button
                        type="button"
                        onclick="copyCode('cssCode')"
                    >
                        Copy
                    </button>

                </div>

                <textarea
                    id="cssCode"
                    spellcheck="false"
                >body {
font-family: Arial;
text-align: center;
padding: 40px;
}

h1 {
color: #8b5cf6;
}

button {
padding: 10px 18px;
border: 0;
border-radius: 10px;
background: #8b5cf6;
color: white;
cursor: pointer;
}</textarea>

            </div>


            <!-- ==================== JAVASCRIPT ==================== -->

            <div class="editor js-editor">

                <div class="editor-header">

                    <span>
                        JavaScript
                    </span>

                    <button
                        type="button"
                        onclick="copyCode('jsCode')"
                    >
                        Copy
                    </button>

                </div>

                <textarea
                    id="jsCode"
                    spellcheck="false"
                >function sayHello() {
alert("Hello from Codexa!");
}</textarea>

            </div>


        </section>

    </section>
        <!-- =================================================
         SAVED PROJECTS PAGE
         ================================================= -->

    <section
        id="savedProjectsPage"
        class="saved-page"
    >

        <div class="saved-top">

            <div>

                <span class="section-label">
                    CODEXA STORAGE
                </span>

                <h1>
                    Saved Projects
                </h1>

                <p>
                    Manage your saved Codexa projects.
                </p>

            </div>

            <button
                id="backToCompilerBtn"
                type="button"
            >
                Back to Compiler
            </button>

        </div>


        <div
            id="projectsGrid"
            class="projects-grid"
        ></div>

    </section>


</main>


<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer class="codexa-footer">

    <span>Codexa</span>

    <span>—</span>

    <span>Build</span>

    <span>•</span>

    <span>Run</span>

    <span>•</span>

    <span>Create</span>

</footer>


<!-- =====================================================
     TOAST MESSAGE
     ===================================================== -->

<div
    id="toastContainer"
    class="toast-container"
    aria-live="polite"
    aria-atomic="true"
></div>


<!-- =====================================================
     IN-PAGE CONFIRMATION
     ===================================================== -->

<div
    id="confirmOverlay"
    class="confirm-overlay"
    aria-hidden="true"
>

    <div
        id="confirmBox"
        class="confirm-box"
    >

        <div class="confirm-glow"></div>

        <div class="confirm-icon">
            !
        </div>

        <h2 id="confirmTitle">
            Confirm Action
        </h2>

        <p id="confirmMessage">
            Are you sure?
        </p>

        <div class="confirm-buttons">

            <button
                id="confirmCancel"
                type="button"
            >
                Cancel
            </button>

            <button
                id="confirmAction"
                class="confirm-danger"
                type="button"
            >
                Continue
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     JSZIP
     ===================================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
></script>


<!-- =====================================================
     CODEXA JAVASCRIPT
     ===================================================== -->

<script
    src="script.js"
></script>

</body>

</html>
